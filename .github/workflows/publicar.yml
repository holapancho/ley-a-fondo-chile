name: Publica una versión

# Se activa al subir un tag vX.Y.Z. Crea el release en GitHub con el .zip de la skill
# (el formato que acepta claude.ai) y las notas de esa versión en CHANGELOG.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
      - name: Revisa que el tag coincida con package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "El tag $GITHUB_REF_NAME no coincide con la versión $version de package.json" >&2
            exit 1
          fi
      - run: npm run empaquetar
      - name: Extrae las notas de la versión
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { dentro = 1; next }
            dentro && /^## \[/ { exit }
            dentro && /^\[.*\]: / { exit }
            dentro { print }
          ' CHANGELOG.md > notas.md
          test -s notas.md || { echo "CHANGELOG.md no tiene la sección $version" >&2; exit 1; }
      - name: Crea el release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/ley-a-fondo-chile.zip --title "$GITHUB_REF_NAME" --notes-file notas.md
